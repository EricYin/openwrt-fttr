[package]
name = "fttr-api"
version = "0.1.0"
edition = "2021"

[features]
codegen = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "fttr-sdk"
path = "src/bin/fttr-sdk.rs"
required-features = ["codegen"]
