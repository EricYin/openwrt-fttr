[package]
name = "h3c-fttr-tools"
version = "0.1.0"
edition = "2021"
description = "H3C HM2004-DU FTTR Micro-OLT utilities and controller daemon"
repository = "https://github.com/LazuliKao/openwrt-fttr"

[features]
default = ["device-hl202"]
device-hl202 = ["dep:flate2", "dep:tar"]
device-hwtc = []
all-devices = ["device-hl202", "device-hwtc"]
acs = ["dep:roxmltree"]

[dependencies]
mqttrs2 = "0.1.0"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
roxmltree = { version = "0.21.1", optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
tar = { version = "0.4", default-features = false, optional = true }

[[bin]]
name = "fttrctl"
path = "src/bin/fttrctl.rs"

[[bin]]
name = "fttrd"
path = "src/bin/fttrd.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
